<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5D4037">
    <meta name="apple-mobile-web-app-title" content="手搖日記">
    <link rel="apple-touch-icon" href="IMG_1586.jpeg">
    <title>手搖成癮日記</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-deep-coffee: #5D4037;
            --color-coffee: #795548;
            --color-latte: #A68B7C;
            --color-milktea: #D7CCC8;
            --color-cream: #F5EBE0;
            --color-paper: #FFFBF5;
        }
        body {
    font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
    background-color: var(--color-paper); 
    color: var(--color-deep-coffee);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    padding-top: 0; 
    background-image: linear-gradient(to bottom, #5D4037 0%, #5D4037 60px, var(--color-paper) 60px, var(--color-paper) 100%);
    background-repeat: no-repeat;
}
        .calendar-card { background-color: white; border-radius: 30px; box-shadow: 0 10px 30px rgba(121, 85, 72, 0.05); }
        .day-cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 14px; position: relative; }
        .day-cell.today-marker { background-color: var(--color-cream); }
        .dots-container { position: absolute; top: 15%; display: flex; gap: 2px; }
        .record-dot { width: 4px; height: 4px; background-color: var(--color-coffee); border-radius: 50%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(93, 64, 55, 0.3); backdrop-filter: blur(12px); z-index: 1000; align-items: center; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, var(--color-coffee), var(--color-deep-coffee)); }
        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .radio-label input:checked + span { background-color: var(--color-coffee); color: white; }
        .nav-active { color: var(--color-coffee) !important; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen pb-24">

    <div class="max-w-md mx-auto text-center pt-24 pb-6">
       
        <div class="flex items-center justify-center gap-3 group">
            <h1 id="mainTitle" class="text-2xl font-black text-[#5D4037]">手搖成癮日記</h1>
            <button onclick="editTitle()" class="opacity-30 hover:opacity-100 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#795548" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <section id="page-calendar" class="page-content space-y-6">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-stone-50 text-center">
                    <p class="text-[9px] text-stone-300 font-black mb-1 uppercase">本月金額</p>
                    <p class="text-xl font-black text-[#795548]">$ <span id="monthTotal">0</span></p>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-stone-50 text-center">
                    <p class="text-[9px] text-stone-300 font-black mb-1 uppercase">本月杯數</p>
                    <p class="text-xl font-black text-[#795548]"><span id="monthCups">0</span> 杯</p>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-stone-50 text-center">
                    <p class="text-[9px] text-stone-300 font-black mb-1 uppercase">年度金額</p>
                    <p class="text-xl font-black text-[#A68B7C]">$ <span id="yearTotal">0</span></p>
                </div>
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-stone-50 text-center">
                    <p class="text-[9px] text-stone-300 font-black mb-1 uppercase">年度杯數</p>
                    <p class="text-xl font-black text-[#A68B7C]"><span id="yearCups">0</span> 杯</p>
                </div>
            </div>
            <div class="calendar-card overflow-hidden">
                <div class="flex items-center justify-between p-5 border-b border-stone-50">
                    <button id="prevMonth" class="w-10 h-10 font-black text-[#795548]">◀</button>
                    <h2 id="currentMonthYear" class="text-lg font-black text-[#5D4037]">2026年 1月</h2>
                    <button id="nextMonth" class="w-10 h-10 font-black text-[#795548]">▶</button>
                </div>
                <div class="p-5">
                    <div class="grid grid-cols-7 mb-3 text-center text-[9px] font-black text-stone-200">
                        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
                </div>
            </div>
        </section>

        <section id="page-stats" class="page-content hidden space-y-4">
            <h3 class="font-black text-[#5D4037] px-2 pt-4">店家分析 🏆</h3>
            <div id="favContent" class="space-y-3 pb-8"></div>
        </section>

        <section id="page-wishlist" class="page-content hidden space-y-4">
    <div class="flex justify-between items-center px-2 pt-4">
        <h3 class="font-black text-[#5D4037]">歷史日記 📖</h3>
    </div>
    <div class="px-2">
        <input type="text" id="drinkSearch" oninput="renderStats()" placeholder="🔍 搜尋店名或品項..." 
               class="w-full p-3 rounded-xl border border-stone-100 shadow-sm text-sm outline-none focus:border-[#795548]">
    </div>
    <div id="statsContent" class="space-y-3 pb-8"></div>
</section>

        <section id="page-settings" class="page-content hidden space-y-6">
            <h3 class="font-black text-[#5D4037] px-2 pt-4">系統設定 ⚙️</h3>
            <div class="bg-white p-6 rounded-[30px] shadow-sm border border-stone-50 space-y-4">
                <button onclick="exportData()" class="w-full py-4 bg-stone-50 text-[#795548] rounded-2xl font-black text-sm flex items-center justify-center gap-2">📤 備份日記數據</button>
                <button onclick="importData()" class="w-full py-4 bg-stone-50 text-[#795548] rounded-2xl font-black text-sm flex items-center justify-center gap-2">📥 還原日記數據</button>
                <hr class="border-stone-100">
                <button onclick="clearData()" class="w-full py-2 text-red-200 text-xs font-black">清空所有數據</button>
            </div>
            <input type="file" id="fileInput" class="hidden" accept=".json">
        </section>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-100 flex justify-around items-center pt-3 pb-8 px-2 z-[100] shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('calendar')" class="nav-btn flex flex-col items-center gap-1 nav-active" data-tab="calendar">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span class="text-[10px] font-black">消費清單</span>
        </button>
        <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center gap-1 text-stone-300" data-tab="stats">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
            <span class="text-[10px] font-black">報表</span>
        </button>
        <button onclick="switchTab('wishlist')" class="nav-btn flex flex-col items-center gap-1 text-stone-300" data-tab="wishlist">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span class="text-[10px] font-black">歷史紀錄</span>
        </button>
        <button onclick="switchTab('settings')" class="nav-btn flex flex-col items-center gap-1 text-stone-300" data-tab="settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="text-[10px] font-black">設定</span>
        </button>
    </nav>

    <div id="entryModal" class="modal p-4">
        <div class="bg-white rounded-[40px] w-full max-w-sm overflow-hidden shadow-2xl border-4 border-white">
            <div class="bg-stone-50 p-6 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-black text-[#5D4037]">紀錄</h3>
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center text-2xl font-light">×</button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="selectedDate">
                <div id="existingDrinksContainer" class="space-y-3"></div>
                <button id="addNewDrinkBtn" onclick="showDrinkForm()" class="w-full py-5 border-2 border-dashed border-[#D7CCC8] text-[#A68B7C] rounded-2xl font-black text-xs">+ 新增紀錄 (最多4杯)</button>
                <form id="drinkForm" class="hidden space-y-4 bg-stone-50/50 p-5 rounded-3xl border border-stone-100">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="shopName" placeholder="店名" required class="w-full p-4 rounded-xl shadow-sm text-sm outline-none">
                        <input type="number" id="price" placeholder="金額" class="w-full p-4 rounded-xl shadow-sm text-sm outline-none">
                    </div>
                    <input type="text" id="itemName" placeholder="飲料名稱" required class="w-full p-4 rounded-xl shadow-sm text-sm outline-none">
                    <div>
    <label class="block text-[10px] font-black text-stone-300 mb-2 ml-1">冰塊</label>
    <div class="options-grid !grid-cols-4">
        <label class="radio-label"><input type="radio" name="ice" value="正常冰" class="hidden" required><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">正常冰</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="少冰" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">少冰</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="微冰" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">微冰</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="去冰" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">去冰</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="常溫" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">常溫</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="溫" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">溫</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="熱" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">熱</span></label>
        <label class="radio-label"><input type="radio" name="ice" value="固定" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">固定</span></label>
    </div>
</div>
                  <div>
    <label class="block text-[10px] font-black text-stone-300 mb-2 ml-1">甜度</label>
    <div class="options-grid !grid-cols-4">
        <label class="radio-label"><input type="radio" name="sugar" value="全糖" class="hidden" required><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">全糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="少糖" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">少糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="半糖" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">半糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="微糖" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">微糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="一分糖" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">一分糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="無糖" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">無糖</span></label>
        <label class="radio-label"><input type="radio" name="sugar" value="固定" class="hidden"><span class="block text-[10px] py-2.5 rounded-lg bg-white shadow-sm text-center border border-transparent">固定</span></label>
    </div>
</div>
                    <div class="flex gap-2 pt-2">
    <button type="button" onclick="hideDrinkForm()" class="flex-1 py-4 text-stone-400 font-black text-[10px]">取消</button>
    <button type="button" id="submitBtn" onclick="handleDrinkSubmit()" class="flex-[2] py-4 btn-primary text-white rounded-xl font-black text-[11px] shadow-lg">儲存 🧋</button>
</div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let drinkData = JSON.parse(localStorage.getItem('drinkData_Permanent')) || {};
        let editingTarget = null; 
        const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

        window.onload = () => {
            const savedTitle = localStorage.getItem('userCustomTitle');
            if (savedTitle) document.getElementById('mainTitle').innerText = savedTitle;
            renderCalendar();
        };

        function saveData() {
            localStorage.setItem('drinkData_Permanent', JSON.stringify(drinkData));
        }

        function editTitle() {
            const newTitle = prompt("想換個什麼標題呢？", document.getElementById('mainTitle').innerText);
            if (newTitle) {
                document.getElementById('mainTitle').innerText = newTitle;
                localStorage.setItem('userCustomTitle', newTitle);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-active', 'text-[#795548]');
                btn.classList.add('text-stone-300');
            });
            const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
            activeBtn.classList.add('nav-active', 'text-[#795548]');
            activeBtn.classList.remove('text-stone-300');
            if (tabId === 'stats') renderFavStats();
            if (tabId === 'wishlist') renderStats();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            document.getElementById('currentMonthYear').innerText = `${currentYear}年 ${monthNames[currentMonth]}`;
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const now = new Date();
            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = (now.getFullYear() === currentYear && now.getMonth() === currentMonth && d === now.getDate());
                const cell = document.createElement('div');
                cell.className = `day-cell text-[#5D4037] text-base font-black ${isToday ? 'today-marker' : ''}`;
                if (drinkData[dateKey]) {
                    const dots = document.createElement('div'); dots.className = 'dots-container';
                    drinkData[dateKey].forEach(() => { const dot = document.createElement('div'); dot.className = 'record-dot'; dots.appendChild(dot); });
                    cell.appendChild(dots);
                }
                cell.innerHTML += `<span>${d}</span>`;
                cell.onclick = () => openModal(dateKey);
                grid.appendChild(cell);
            }
            updateDashboard();
        }

        function updateDashboard() {
            let mTotal = 0, mCups = 0, yTotal = 0, yCups = 0;
            const mPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            const yPrefix = `${currentYear}-`; 

            Object.keys(drinkData).forEach(date => {
                if (date.startsWith(yPrefix)) {
                    drinkData[date].forEach(d => {
                        const p = parseFloat(d.price) || 0;
                        yTotal += p; yCups++;
                        if (date.startsWith(mPrefix)) { mTotal += p; mCups++; }
                    });
                }
            });
            document.getElementById('monthTotal').innerText = mTotal.toLocaleString();
            document.getElementById('monthCups').innerText = mCups;
            document.getElementById('yearTotal').innerText = yTotal.toLocaleString();
            document.getElementById('yearCups').innerText = yCups;
        }

        function openModal(date) {
            document.getElementById('selectedDate').value = date;
            document.getElementById('modalTitle').innerText = date.replace(/-/g, ' / ');
            hideDrinkForm(); 
            renderExistingDrinks();
            document.getElementById('entryModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('entryModal').style.display = 'none'; }
        
        function showDrinkForm() { 
            document.getElementById('drinkForm').classList.remove('hidden'); 
            document.getElementById('addNewDrinkBtn').style.display = 'none'; 
        }

        function hideDrinkForm() { 
            document.getElementById('drinkForm').classList.add('hidden'); 
            document.getElementById('drinkForm').reset();
            editingTarget = null;
            document.getElementById('submitBtn').innerText = "儲存 🧋";
            renderExistingDrinks(); 
        }

        function renderExistingDrinks() {
            const date = document.getElementById('selectedDate').value;
            const drinks = drinkData[date] || [];
            document.getElementById('existingDrinksContainer').innerHTML = drinks.map((d, i) => `
                <div class="bg-white p-4 rounded-2xl border border-stone-100 flex justify-between items-center shadow-sm mb-2">
                    <div>
                        <p class="text-[9px] text-stone-300 font-black tracking-tight">${d.shop}</p>
                        <p class="font-black text-sm text-[#5D4037]">${d.item}</p>
                        <p class="text-[9px] text-stone-400">${d.ice} / ${d.sugar} ・ $${d.price}</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="editDrink('${date}', ${i})" class="text-[#795548] text-[10px] font-black p-2">編輯</button>
                        <button onclick="deleteDrink(${i})" class="text-red-200 text-[10px] font-black p-2">刪除</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('addNewDrinkBtn').style.display = drinks.length >= 4 ? 'none' : 'block';
        }

        function handleDrinkSubmit() {
            if (editingTarget !== null) {
                saveEdit();
            } else {
                addDrink();
            }
        }

        function addDrink() {
            const date = document.getElementById('selectedDate').value;
            const shop = document.getElementById('shopName').value;
            const item = document.getElementById('itemName').value;
            const price = document.getElementById('price').value;
            const ice = document.querySelector('input[name="ice"]:checked')?.value || "正常";
            const sugar = document.querySelector('input[name="sugar"]:checked')?.value || "正常";

            if (!shop || !item) return alert("店名和品項必填喔！");

            if (!drinkData[date]) drinkData[date] = [];
            drinkData[date].push({ shop, item, price, ice, sugar });

            saveData();
            renderCalendar();
            hideDrinkForm();
        }

        function editDrink(date, index) {
            const drink = drinkData[date][index];
            editingTarget = { date, index };
            showDrinkForm();
            document.getElementById('shopName').value = drink.shop;
            document.getElementById('itemName').value = drink.item;
            document.getElementById('price').value = drink.price;
            const iceTarget = document.querySelector(`input[name="ice"][value="${drink.ice}"]`);
            if (iceTarget) iceTarget.checked = true;
            const sugarTarget = document.querySelector(`input[name="sugar"][value="${drink.sugar}"]`);
            if (sugarTarget) sugarTarget.checked = true;
            document.getElementById('submitBtn').innerText = "儲存修改 ✨";
        }

        function saveEdit() {
            const { date, index } = editingTarget;
            drinkData[date][index] = {
                shop: document.getElementById('shopName').value,
                item: document.getElementById('itemName').value,
                price: document.getElementById('price').value,
                ice: document.querySelector('input[name="ice"]:checked')?.value || "正常",
                sugar: document.querySelector('input[name="sugar"]:checked')?.value || "正常"
            };
            saveData();
            editingTarget = null;
            document.getElementById('submitBtn').innerText = "儲存 🧋";
            renderCalendar();
            hideDrinkForm();
        }

        function deleteDrink(index) {
            const date = document.getElementById('selectedDate').value;
            drinkData[date].splice(index, 1);
            if (!drinkData[date].length) delete drinkData[date];
            saveData();
            renderCalendar(); 
            renderExistingDrinks();
        }

        function renderStats() {
            const search = document.getElementById('drinkSearch').value.toLowerCase();
            const statsContent = document.getElementById('statsContent');
            let html = '';
            const sortedDates = Object.keys(drinkData).sort().reverse();
            sortedDates.forEach(date => {
                drinkData[date].forEach((d, i) => {
                    if (d.shop.toLowerCase().includes(search) || d.item.toLowerCase().includes(search)) {
                        html += `
                            <div onclick="editDrink('${date}', ${i})" class="bg-white p-4 rounded-2xl shadow-sm border border-stone-50 mb-2 cursor-pointer">
                                <p class="text-[9px] text-stone-300 font-black">${date}</p>
                                <p class="font-black text-[#5D4037]">${d.shop} · ${d.item}</p>
                                <p class="text-[9px] text-stone-400">${d.ice} / ${d.sugar} · $${d.price}</p>
                            </div>`;
                    }
                });
            });
            statsContent.innerHTML = html || '<p class="text-center text-stone-300 py-10">找不到紀錄</p>';
        }

        function renderFavStats() {
            const shopStats = {};
            Object.keys(drinkData).forEach(date => {
                drinkData[date].forEach(d => {
                    if (!shopStats[d.shop]) shopStats[d.shop] = { count: 0, total: 0 };
                    shopStats[d.shop].count++;
                    shopStats[d.shop].total += Number(d.price) || 0;
                });
            });
            const sorted = Object.entries(shopStats).sort((a,b) => b[1].count - a[1].count);
            document.getElementById('favContent').innerHTML = sorted.map(([shop, s]) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm mb-2">
                    <span class="font-black text-[#5D4037]">${shop}</span>
                    <span class="text-xs text-stone-400">${s.count} 杯 / $${s.total}</span>
                </div>
            `).join('') || '<p class="text-center text-stone-300 py-10">尚無統計資料</p>';
        }

        document.getElementById('prevMonth').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderCalendar(); };
    </script>
</body>
</html>
